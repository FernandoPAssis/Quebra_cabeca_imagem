<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quebra-Cabeça de Imagens 🧩</title>

    <script src="cdn_tailwindcss_com_3_4_17.js"></script>
    <script src="script_imagem.js?v=4" defer></script>

    <style>
        .piece {
            touch-action: none;
        }



        /*CSS VOLTAR AO PORTAL INICIO*/
        /* Contêiner do Botão Centralizado */
        .portal-nav-container {
            width: 100%;
            display: flex;
            justify-content: center; /* Alinha perfeitamente ao centro da tela */
            align-items: center;
            margin-bottom: 20px; /* Dá um espaçamento bacana em relação ao título */
            box-sizing: border-box;
        }


        /* Estilização do Botão Bonito */
        .btn-voltar-portal {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15), 0 2px 0 #205081;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            user-select: none;
        }

            /* Ícone */
            .btn-voltar-portal .btn-icon {
                font-size: 18px;
                transition: transform 0.25s ease;
            }

            /* Efeito Hover (ao passar o mouse) */
            .btn-voltar-portal:hover {
                background: linear-gradient(135deg, #357ABD 0%, #285E8E 100%);
                transform: translateY(-3px) scale(1.03);
                box-shadow: 0 7px 15px rgba(0, 0, 0, 0.2), 0 3px 0 #183D63;
                color: #ffffff;
            }

                .btn-voltar-portal:hover .btn-icon {
                    transform: translateX(-3px) scale(1.1);
                }

            /* Efeito Clique */
            .btn-voltar-portal:active {
                transform: translateY(1px) scale(0.98);
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15), 0 1px 0 #183D63;
            }

        /* Ajuste Responsivo para Celular */
        @media (max-width: 480px) {
            .btn-voltar-portal {
                padding: 8px 14px;
                font-size: 13px;
            }

                .btn-voltar-portal .btn-icon {
                    font-size: 16px;
                }
        }

        /*CSS VOLTAR AO PORTAL FIM*/
    </style>
</head>
<body class="bg-amber-100 min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans select-none">

    <div class="bg-white p-4 sm:p-6 rounded-3xl shadow-2xl border-4 border-amber-300 w-full max-w-3xl my-auto flex flex-col justify-between">

        <!-- TELA 1: GALERIA DE IMAGENS -->
        <div id="gallery-screen" class="text-center">

            <!-- Botão de Voltar ao Portal -->
            <div class="portal-nav-container">
                <a href="https://fernandopassis.github.io/Portal-principal/index.html" class="btn-voltar-portal">
                    <span class="btn-icon">🏠</span>
                    <span class="btn-text">Voltar ao Portal</span>
                </a>
            </div>

            <h1 class="text-2xl sm:text-3xl font-extrabold text-indigo-600 mb-1">
                🧩 Escolha uma Imagem
            </h1>
            <p class="text-gray-600 font-medium mb-3 text-xs sm:text-sm">Selecione o nível de dificuldade e a imagem para montar:</p>

            <!-- Seleção de Dificuldade (4 Níveis) -->
            <div class="flex flex-wrap justify-center gap-1.5 sm:gap-2 mb-4">
                <button onclick="setGridSize(2)" id="btn-diff-2" class="diff-btn px-2.5 py-1.5 rounded-xl font-bold text-xs sm:text-sm bg-gray-200 text-gray-700 hover:bg-gray-300">Fácil (2x2)</button>
                <button onclick="setGridSize(3)" id="btn-diff-3" class="diff-btn px-2.5 py-1.5 rounded-xl font-bold text-xs sm:text-sm bg-indigo-500 text-white shadow-md">Médio (3x3)</button>
                <button onclick="setGridSize(4)" id="btn-diff-4" class="diff-btn px-2.5 py-1.5 rounded-xl font-bold text-xs sm:text-sm bg-gray-200 text-gray-700 hover:bg-gray-300">Difícil (4x4)</button>
                <button onclick="setGridSize(5)" id="btn-diff-5" class="diff-btn px-2.5 py-1.5 rounded-xl font-bold text-xs sm:text-sm bg-gray-200 text-gray-700 hover:bg-gray-300">Expert (5x5)</button>
            </div>

            <div class="mb-4">
                <input type="file" id="user-photo-input" accept="image/*" class="hidden" onchange="handleUserPhoto(event)">
                <label for="user-photo-input" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-xl shadow-md cursor-pointer text-xs sm:text-sm transition inline-flex items-center gap-2 active:scale-95">
                    📷 Usar minha própria foto
                </label>
            </div>

            <div id="gallery-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2 sm:gap-3 max-h-[50vh] sm:max-h-[60vh] overflow-y-auto p-2 bg-amber-50 rounded-2xl border-2 border-amber-200">
            </div>
        </div>

        <!-- TELA 2: TABULEIRO DO JOGO -->
        <div id="game-screen" class="hidden flex flex-col items-center w-full text-center">

            <div class="flex flex-wrap justify-between items-center w-full mb-3 gap-2">
                <button onclick="showGallery()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 px-3 rounded-xl transition text-xs">
                    ⬅️ Voltar
                </button>

                <!-- Troca rápida de nível durante o jogo -->
                <div class="flex gap-1">
                    <button onclick="changeGridAndReset(2)" id="btn-game-diff-2" class="game-diff-btn px-2 py-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700">2x2</button>
                    <button onclick="changeGridAndReset(3)" id="btn-game-diff-3" class="game-diff-btn px-2 py-1 rounded-lg text-xs font-bold bg-indigo-500 text-white">3x3</button>
                    <button onclick="changeGridAndReset(4)" id="btn-game-diff-4" class="game-diff-btn px-2 py-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700">4x4</button>
                    <button onclick="changeGridAndReset(5)" id="btn-game-diff-5" class="game-diff-btn px-2 py-1 rounded-lg text-xs font-bold bg-gray-200 text-gray-700">5x5</button>
                </div>

                <button onclick="initPuzzle()" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-1.5 px-3 rounded-xl shadow-md text-xs transition active:scale-95">
                    🔄 Embaralhar
                </button>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 items-center justify-center w-full">

                <!-- Tabuleiro -->
                <div class="flex flex-col items-center">
                    <span class="text-xs font-bold text-amber-800 uppercase tracking-wider mb-1">Tabuleiro</span>
                    <div id="board" class="grid gap-0 bg-amber-200 rounded-2xl shadow-inner w-72 h-72 sm:w-80 sm:h-80 overflow-hidden border-2 border-amber-300">
                    </div>
                </div>

                <!-- Área de Peças Soltas -->
                <div class="flex flex-col items-center w-full sm:w-auto">
                    <span class="text-xs font-bold text-amber-800 uppercase tracking-wider mb-1">Peças Soltas</span>
                    <div id="pieces-bank" class="flex flex-wrap gap-2 bg-amber-50 p-3 rounded-2xl border-2 border-amber-200 w-72 min-h-[160px] sm:w-80 sm:h-80 items-center justify-center overflow-y-auto">
                    </div>
                </div>

            </div>

            <div id="win-message" class="hidden mt-3 bg-emerald-100 border-2 border-emerald-400 p-2.5 rounded-2xl text-emerald-800 font-bold text-sm animate-bounce w-full">
                🎉 Parabéns! Você completou o quebra-cabeça! 🌟
            </div>

        </div>

    </div>

</body>
</html>
